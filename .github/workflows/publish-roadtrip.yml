name: Publish roadtrip page

# 仅发布本次授权的独立静态页；不触发应用构建或服务启停。
on:
  push:
    branches: [codex/roadtrip-hotels-20260926]
    paths: [public-pages/guoqing-roadtrip.html, .github/workflows/publish-roadtrip.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-guoqing-roadtrip
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # 发布前核查结构、导航锚点、更新标记与错误旧文案。
      - name: Validate page
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.anchors=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.append(a['id'])
                  if a.get('href','').startswith('#'): self.anchors.append(a['href'][1:])
          text=Path('public-pages/guoqing-roadtrip.html').read_text()
          p=Page(); p.feed(text)
          assert len(p.ids)==len(set(p.ids))
          assert all(a in p.ids for a in p.anchors)
          assert '住宿复核更新' in text and '4344' in text and '3772' in text and 'homestays' in text and '3585' in text
          assert '唯一做到两个独立样本池双确认' not in text
          assert len(text.splitlines()) <= 400
          print('Page structure, navigation and content checks passed')
          PY
      # 使用现有部署密钥与已核实主机公钥，凭据只在临时运行环境使用。
      - name: Publish verified static page
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/roadtrip_key
          chmod 600 ~/.ssh/roadtrip_key
          trap 'rm -f ~/.ssh/roadtrip_key' EXIT
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILy2/IMn1STsfYeHb5QRBzq2gmPRA6UoSjUgGSbg+S2Q\n' "$DEPLOY_HOST" > ~/.ssh/known_hosts
          target="$DEPLOY_USER@$DEPLOY_HOST"
          staged="/home/ubuntu/pages/.guoqing-roadtrip-${GITHUB_SHA}.html"
          scp -i ~/.ssh/roadtrip_key -o StrictHostKeyChecking=yes public-pages/guoqing-roadtrip.html "$target:$staged"
          # 校验值取已上线的Git文件字节（LF），不可用Windows工作树CRLF字节计算。
          # 比较旧版校验和防止覆盖并发修改；备份后原子替换单一文件。
          ssh -i ~/.ssh/roadtrip_key -o StrictHostKeyChecking=yes "$target" "set -eu; test \$(sha256sum /home/ubuntu/pages/guoqing-roadtrip.html | cut -d' ' -f1) = b0dde1baf9d2652f466e88dbe79926e3058314a530671214c783844700eb974b; mkdir -p /home/ubuntu/backups/public-pages; cp -p /home/ubuntu/pages/guoqing-roadtrip.html /home/ubuntu/backups/public-pages/guoqing-roadtrip-before-${GITHUB_SHA}.html; chmod 644 '$staged'; mv '$staged' /home/ubuntu/pages/guoqing-roadtrip.html"
          curl -fsSL --retry 3 'https://mediscribe.cn/pages/guoqing-roadtrip.html' -o /tmp/roadtrip-live.html
          cmp public-pages/guoqing-roadtrip.html /tmp/roadtrip-live.html
