name: Deploy to Production

# 触发方式：监听 CI workflow 在 main 分支上跑完成功的事件，而不是直接 push main。
# 旧方式 (push: main) 跟 CI 并行触发，CI 红灯时 deploy 也会照样跑 → 坏代码上线。
# 改成 workflow_run 后，deploy 只在 CI 整体 conclusion == success 时才执行，
# 配合 main 分支的 branch protection 双保险：所有进 main 的 commit 都过 CI gate。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    # workflow_run 不管 CI 成功/失败都触发，必须在 job 层 if 过滤掉失败 + 非 main 的情况
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment: production

    steps:
      # checkout 必须 fetch-depth: 0，否则 sentry-cli set-commits --auto
      # 拿不到完整 git 历史，无法关联 release 与 commits
      # ref 显式指向触发本次 deploy 的那个 commit（CI 通过的 SHA），
      # 避免 workflow_run 上下文里 GITHUB_SHA 默认指 main HEAD 的歧义
      # persist-credentials: false —— 不把 GITHUB_TOKEN 写进 .git/config。
      # .git 会随 rsync 同步到服务器（让服务器 git status/log 与部署版本一致），
      # 绝不能把凭证一起带过去；本流程 checkout 后只读不推，关掉无副作用。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # 计算本次部署的 release 标识：用 git short SHA（如 a7873b2），
      # 同一份代码的 release 名字在 Sentry 里全局唯一，不会重复创建
      - name: Compute release version
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 创建 Sentry release：自动关联本次 commits、finalize、标记 production 部署
      # 在 SSH deploy 之前执行：保证应用启动后上报 event 时 release object 已存在
      # 否则 event 上的 release tag 会"挂空"，关联不到 commits
      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mediscribe-s0
          SENTRY_PROJECT: python-fastapi
        with:
          environment: production
          version: ${{ steps.vars.outputs.sha }}

      # 把 CI 通过的这份代码从 Actions 侧直接 rsync 推到服务器。
      # 替代原先"服务器上 git fetch"——阿里云→GitHub 出站不稳定，曾导致
      # deploy 连挂两次（2026-07-27）；Actions 机器在海外拉 GitHub 天然稳，
      # 推送走的又是本来就通的 SSH 通道，服务器从此完全无需访问 GitHub。
      # --delete 保证与仓库强一致（等价原 reset --hard 的"单一真相源"语义），
      # 但排除服务器侧运行时产物：.env（生产密钥）、logs/（运行日志）。
      # .git 一并同步：服务器 git status 保持干净、git log 可查当前部署版本
      # （凭证不落 .git，见上方 persist-credentials: false）。
      - name: Push code to server via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            --exclude='.env' --exclude='logs' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/app/"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        # SENTRY_RELEASE 通过 envs 字段穿透到 ssh 脚本里，
        # 再 export 给 docker compose，docker-compose.yml 用 ${SENTRY_RELEASE:-} 接收
        env:
          SENTRY_RELEASE: ${{ steps.vars.outputs.sha }}
        with:
          envs: SENTRY_RELEASE
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /app
            # 代码已由上一步 rsync 从 Actions 推送到位（服务器不再访问 GitHub，
            # 原 git fetch + reset --hard 流程已废除；强一致由 rsync --delete 保证）
            export SENTRY_RELEASE

            # 清理之前 deploy 中断留下的僵尸 container（名字前缀带随机 hash 的）
            # 例如 "c88ced3f53af_app-backend-1"——是 docker compose 重建中崩溃残留
            # 不影响健康容器（健康容器名字不带 hash 前缀）
            docker ps -a --format "{{.Names}}" 2>/dev/null \
              | grep -E "^[a-f0-9]{12}_app-" \
              | xargs -r docker rm -f 2>&1 || true

            # 镜像走 daocloud（library/*）+ 1ms.run（orthancteam）反代
            # 在 docker-compose.yml 与 Dockerfile 里写死前缀，不依赖 daemon mirror
            # （SSH user 无 root 权限改不了 /etc/docker/daemon.json）
            #
            # pull 加 || true 容错：1ms.run 偶尔把镜像下架（如 orthanc 25.6.2
            # 已被反代删除要付费），但本地 image 还在跑，不需要每次 deploy
            # 都重新拉。失败时降级到本地缓存，up -d 默认 --pull missing 不会
            # 二次尝试。代价：image 升级需要在 compose 文件里改 tag 触发重建。
            docker compose pull --ignore-buildable || echo "[deploy] WARN: 部分 image pull 失败，使用本地缓存继续"
            docker compose build backend frontend

            # 先单独起 db 等它 healthy（其他 service 都依赖 db；orthanc 需要 db
            # 里有 orthanc 库才能起来，不能让 orthanc 启动时 db 还没准备好）
            docker compose up -d db
            for i in $(seq 1 20); do
              db_h=$(docker inspect --format='{{.State.Health.Status}}' app-db-1 2>/dev/null || echo "starting")
              [ "$db_h" = "healthy" ] && break
              sleep 3
            done
            # db healthy 后立即建 orthanc 库（幂等，已存在则跳过）
            docker compose exec -T db psql -U medassist -d medassist -tc \
              "SELECT 1 FROM pg_database WHERE datname='orthanc'" | grep -q 1 \
              || docker compose exec -T db createdb -U medassist orthanc

            # 迁移前自动备份（2026-08-11 病历安全；2026-08-12 收口时移到容器启动前——
            # 新 entrypoint 在容器启动时就跑 alembic，备份必须发生在任何迁移之前才有意义）。
            # 失败仅告警不阻断；只保留最近 10 份防塞满盘。
            mkdir -p /app/backups
            BK="/app/backups/pre_migrate_$(date +%Y%m%d_%H%M%S).sql"
            if docker compose exec -T db pg_dump -U medassist medassist > "$BK" 2>/dev/null; then
              echo "[deploy] 迁移前备份 OK: $BK ($(du -h "$BK" | cut -f1))"
            else
              echo "[deploy] WARN: 迁移前 pg_dump 失败，继续部署（迁移幂等，风险可控）"
              rm -f "$BK"
            fi
            ls -t /app/backups/pre_migrate_*.sql 2>/dev/null | tail -n +11 | xargs -r rm -f

            # 现在 db + orthanc 库都就绪，正常 up 全部 service
            # （backend entrypoint 会执行 alembic_guard + alembic upgrade head + 种子）
            # 不用 --wait，改成显式 up + 自己轮询 backend / frontend 关键服务 healthy
            docker compose up -d
            for i in $(seq 1 30); do
              backend_h=$(docker inspect --format='{{.State.Health.Status}}' app-backend-1 2>/dev/null || echo "starting")
              frontend_h=$(docker inspect --format='{{.State.Health.Status}}' app-frontend-1 2>/dev/null || echo "starting")
              echo "[deploy] poll $i: backend=$backend_h frontend=$frontend_h"
              if [ "$backend_h" = "healthy" ] && [ "$frontend_h" = "healthy" ]; then
                break
              fi
              sleep 5
            done
            if [ "$backend_h" != "healthy" ] || [ "$frontend_h" != "healthy" ]; then
              echo "[deploy] FATAL: backend / frontend 未在 150s 内 healthy"
              docker compose logs --tail=50 backend frontend
              exit 1
            fi
            # orthanc unhealthy 不 fatal（PACS 影像功能可单独修），仅 dump 日志便于排查
            orthanc_h=$(docker inspect --format='{{.State.Health.Status}}' app-orthanc-1 2>/dev/null || echo "missing")
            if [ "$orthanc_h" != "healthy" ]; then
              echo "[deploy] WARNING: orthanc=$orthanc_h（PACS 影像功能可能不可用）"
              docker compose logs --tail=40 orthanc 2>&1 | tail -40 || true
            fi
            # ── 迁移单通道（2026-08-12 收口）────────────────────────────────
            # alembic 是唯一 schema 真源（migrate.py / schema_compat / init_db
            # 的 create_all 均已删除）。entrypoint 启动时已跑过 guard + upgrade，
            # 这里再显式执行一遍：幂等、且把迁移状态打进 deploy 日志便于复盘。
            # alembic_guard 只在存量库版本缺失/指向旧链时 stamp 到基线（零 DDL）。
            docker compose exec -T backend python alembic_guard.py
            docker compose exec -T backend alembic current
            docker compose exec -T backend alembic upgrade head
            # seed_config 维护质控规则与 Prompt 模板（重复执行幂等）
            docker compose exec -T backend python seed_config.py

            # ── 备份基础设施前置条件（幂等，每次部署都跑）─────────────────
            # /var/backups 默认 root:root，ubuntu 写不进去 → 备份脚本 mkdir 会 fail
            # /var/log/mediscribe-backup.log 同理（cron 用 >> 追加要可写）
            # 用 install -d 一次性建目录并 chown 给当前 ssh user（ubuntu）
            sudo install -d -o "$(id -u)" -g "$(id -g)" -m 750 /var/backups/mediscribe
            sudo touch /var/log/mediscribe-backup.log
            sudo chown "$(id -u):$(id -g)" /var/log/mediscribe-backup.log

            # ── 自动配置 crontab：每天凌晨 3 点跑 backup.sh 备份 PG + Orthanc + uploads
            # backup.sh 的 +x 已在 git 仓库里标记为 100755（git update-index --chmod=+x）
            # reset --hard 会保留 mode bit，不需要再 chmod
            # 检查 crontab 是否已含 backup.sh，没有则追加（幂等，不会重复加）
            BACKUP_CRON="0 3 * * * /app/backend/scripts/backup.sh >> /var/log/mediscribe-backup.log 2>&1"
            if ! crontab -l 2>/dev/null | grep -qF "/app/backend/scripts/backup.sh"; then
              echo "[deploy] 配置每日备份 crontab..."
              # 追加到现有 crontab（保留之前的）
              (crontab -l 2>/dev/null; echo "$BACKUP_CRON") | crontab -
              echo "[deploy] crontab 已配置：$BACKUP_CRON"
            fi

            # ── 自动配置 crontab：每天 00:05 轮转应用日志（2026-08-13 审计修复配套）
            # 应用侧已改 WatchedFileHandler（多进程安全），轮转必须由**单进程**做，
            # 否则两个 uvicorn worker 各自 rename 会竞态丢日志（error.log 是排障入口）。
            LOG_ROTATE_CRON="5 0 * * * /app/backend/scripts/rotate_logs.sh >> /var/log/mediscribe-backup.log 2>&1"
            if ! crontab -l 2>/dev/null | grep -qF "scripts/rotate_logs.sh"; then
              echo "[deploy] 配置每日日志轮转 crontab..."
              (crontab -l 2>/dev/null; echo "$LOG_ROTATE_CRON") | crontab -
              echo "[deploy] crontab 已配置：$LOG_ROTATE_CRON"
            fi

            # ── 自动配置 crontab：每天凌晨 4 点清理 30 天前的语音文件
            # 转写文本与结构化病历永久保留，只删原始 webm（详见 cleanup_voice.py）
            # 4 点跑避开 3 点备份高峰；保留 30 天满足"近一个月可回溯"
            sudo touch /var/log/mediscribe-voice-cleanup.log
            sudo chown "$(id -u):$(id -g)" /var/log/mediscribe-voice-cleanup.log
            VOICE_CLEANUP_CRON="0 4 * * * cd /app && docker compose exec -T backend python scripts/cleanup_voice.py >> /var/log/mediscribe-voice-cleanup.log 2>&1"
            if ! crontab -l 2>/dev/null | grep -qF "scripts/cleanup_voice.py"; then
              echo "[deploy] 配置每日语音清理 crontab..."
              (crontab -l 2>/dev/null; echo "$VOICE_CLEANUP_CRON") | crontab -
              echo "[deploy] crontab 已配置：$VOICE_CLEANUP_CRON"
            fi

            echo "Deploy finished at $(date) release=$SENTRY_RELEASE"

      - name: Health check
        run: |
          sleep 15
          curl --fail --retry 3 --retry-delay 5 \
            "http://${{ secrets.SERVER_HOST }}/api/v1/health" \
            && echo "Health check passed" \
            || (echo "Health check failed" && exit 1)
